name: Backup do Banco (Produção)

# Gera um backup criptografado do banco de produção, sem alterar nada.
# Uso: ao fim de cada evento e antes de operações arriscadas. Não é bloqueado pelo congelamento.
# Guia: docs/operacao/ci-cd-e-deploy.md#backups

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.122.0

jobs:
  backup:
    name: Backup criptografado
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_HOST: ${{ vars.SUPABASE_DB_HOST }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar CLI do Supabase
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Conferir secrets obrigatórios
        run: |
          for v in SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF SUPABASE_DB_HOST BACKUP_PASSPHRASE; do
            if [ -z "${!v}" ]; then echo "::error::$v não configurado (secret do ambiente production ou variável do repositório)."; exit 1; fi
          done

      - name: Montar conexão com o banco (pooler IPv4, sem token de conta)
        run: |
          SENHA=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
          URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${SENHA}@${SUPABASE_DB_HOST}:5432/postgres"
          echo "::add-mask::$SENHA"
          echo "::add-mask::$URL"
          echo "DB_URL=$URL" >> "$GITHUB_ENV"

      - name: Backup (estrutura + dados, criptografado)
        run: |
          mkdir -p backup
          supabase db dump --db-url "$DB_URL" -f backup/estrutura.sql
          supabase db dump --db-url "$DB_URL" --data-only --use-copy -f backup/dados.sql
          tar -czf backup.tar.gz backup
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "backup-${GITHUB_RUN_ID}.tar.gz.gpg" backup.tar.gz
          rm -rf backup backup.tar.gz

      - name: Guardar backup (30 dias)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-banco-${{ github.run_id }}
          path: backup-${{ github.run_id }}.tar.gz.gpg
          retention-days: 30
          if-no-files-found: error
