name: Pipeline de Testes (QA)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria de Tipagem TypeScript (Linter Gate)
        run: npm run lint

      - name: Executar Auditoria do Vitest (QA Gate)
        run: npx vitest run
