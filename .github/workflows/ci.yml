name: Pipeline de Testes (QA)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Só leitura: o CI não grava nada no repositório
permissions:
  contents: read

jobs:
  test:
    name: Testes Automatizados (Vitest & Linter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Auditoria de Tipagem TypeScript (Linter Gate)
        run: npm run lint

      - name: Executar Auditoria do Vitest (QA Gate)
        run: npx vitest run

      - name: Validar Build de Produção (Vite Build Gate)
        run: npm run build

