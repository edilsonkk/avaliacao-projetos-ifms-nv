name: Pipeline de Testes (QA)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Só leitura: o CI não grava nada no repositório
permissions:
  contents: read

jobs:
  test:
    name: Testes Automatizados (Vitest & Linter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Auditoria de Tipagem TypeScript (Linter Gate)
        run: npm run lint

      - name: Executar Auditoria do Vitest (QA Gate)
        run: npx vitest run

      - name: Validar Build de Produção (Vite Build Gate)
        run: npm run build

