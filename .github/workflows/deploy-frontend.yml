name: Deploy do Front-end (Produção)

# Publica o front-end no Firebase Hosting (projeto em .firebaserc).
# - Chamado pelo release.yml quando uma versão é publicada.
# - Manual (Actions → Run workflow) para rollback: informe a tag de uma versão anterior.
# Guia: docs/operacao/ci-cd-e-deploy.md

on:
  workflow_call:
    inputs:
      ref:
        description: 'Tag ou commit a publicar'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag a publicar (ex.: v0.2.0). Use uma tag anterior para rollback.'
        required: true
        type: string
      emergencia:
        description: 'Ignorar o congelamento de deploy (somente correção crítica durante a feira)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-frontend-producao
  cancel-in-progress: false

jobs:
  deploy:
    name: Build e publicação da versão ${{ inputs.ref }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Respeitar congelamento de deploy
        if: vars.CONGELAMENTO_DEPLOY == 'true' && !inputs.emergencia
        run: |
          echo "::error::Deploy congelado (variável CONGELAMENTO_DEPLOY = true). Para correção crítica, rode manualmente com 'emergencia'."
          exit 1

      - name: Checkout da versão
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Checagem de tipos
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Conferir secrets obrigatórios
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          for v in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY FIREBASE_SERVICE_ACCOUNT; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v não configurado no ambiente production."; exit 1; fi
          done

      - name: Build de produção
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          APP_URL: ${{ vars.APP_URL }}
        run: npm run build

      - name: Publicar no Firebase Hosting (canal live)
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
