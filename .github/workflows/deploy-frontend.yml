name: Deploy do Front-end (Produção)

# Publica o front-end no GitHub Pages.
# - Chamado pelo release.yml quando uma versão é publicada.
# - Manual (Actions → Run workflow) para rollback: informe a tag de uma versão anterior.
# Guia: docs/operacao/ci-cd-e-deploy.md

on:
  workflow_call:
    inputs:
      ref:
        description: 'Tag ou commit a publicar'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag a publicar (ex.: v0.2.0). Use uma tag anterior para rollback.'
        required: true
        type: string
      emergencia:
        description: 'Ignorar o congelamento de deploy (somente correção crítica durante a feira)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-frontend-producao
  cancel-in-progress: false

jobs:
  build:
    name: Build da versão ${{ inputs.ref }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Respeitar congelamento de deploy
        if: vars.CONGELAMENTO_DEPLOY == 'true' && !inputs.emergencia
        run: |
          echo "::error::Deploy congelado (variável CONGELAMENTO_DEPLOY = true). Para correção crítica, rode manualmente com 'emergencia'."
          exit 1

      - name: Checkout da versão
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de tipos
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Conferir secrets obrigatórios
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          for v in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v não configurado no ambiente production."; exit 1; fi
          done

      - name: Build de produção
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          APP_URL: ${{ vars.APP_URL }}
        run: npm run build

      - name: Empacotar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
