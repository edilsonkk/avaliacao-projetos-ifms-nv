name: Deploy de Migrações do Supabase (Database CI/CD)

# Aplica supabase/migrations/ no banco remoto com `supabase db push`.
# Guia: docs/banco-de-dados/migrations.md

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: apenas mostrar o que seria aplicado (supabase db push --dry-run)'
        required: true
        default: true
        type: boolean
      target_environment:
        description: 'Ambiente de banco de dados de destino'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

# Uma aplicação de migrations por ambiente de cada vez, nunca cancelada no meio.
concurrency:
  group: supabase-migrations-${{ inputs.target_environment || 'production' }}
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.122.0

jobs:
  validate-migrations:
    name: Validação Estática das Migrações SQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Validar nomes dos arquivos (AAAAMMDDHHMMSS_descricao.sql, versões únicas)
        run: |
          status=0
          for f in supabase/migrations/*.sql; do
            nome=$(basename "$f")
            if ! [[ "$nome" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "::error file=$f::Nome fora do padrão AAAAMMDDHHMMSS_descricao_em_snake_case.sql"
              status=1
            fi
          done
          duplicadas=$(ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$duplicadas" ]; then
            echo "::error::Versões de migration repetidas: $duplicadas"
            status=1
          fi
          exit $status

      - name: Bloquear DELETE sem WHERE, TRUNCATE e INDEX CONCURRENTLY
        run: |
          if grep -inE '^\s*DELETE\s+FROM\s+[a-zA-Z0-9_\.]+\s*;' supabase/migrations/*.sql; then
            echo "::error::DELETE sem cláusula WHERE em migration. Use 'WHERE <id> IS NOT NULL'."
            exit 1
          fi
          if grep -inE '^\s*TRUNCATE\s+(TABLE\s+)?[a-zA-Z0-9_\.]+' supabase/migrations/*.sql; then
            echo "::error::TRUNCATE em migration. Use DELETE com WHERE explícito."
            exit 1
          fi
          if grep -inE 'CREATE\s+(UNIQUE\s+)?INDEX\s+CONCURRENTLY' supabase/migrations/*.sql; then
            echo "::error::CREATE INDEX CONCURRENTLY não roda dentro da transação do supabase db push."
            exit 1
          fi
          echo "Validação estática concluída."

  deploy-migrations:
    name: Aplicar Migrações (supabase db push)
    needs: validate-migrations
    # Só roda em push para main ou manualmente, e somente depois que o histórico de migrations do
    # banco remoto foi alinhado (variável SUPABASE_DB_PUSH_ENABLED = 'true'). Ver migrations.md.
    if: >-
      vars.SUPABASE_DB_PUSH_ENABLED == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment || 'production' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar CLI do Supabase
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Conferir segredos obrigatórios
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v não configurado no ambiente."; exit 1; fi
          done

      - name: Vincular projeto remoto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Histórico antes (local x remoto)
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Aplicar migrations pendentes
        if: github.event_name == 'push' || !inputs.dry_run
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Histórico depois (todas devem constar no remoto)
        if: github.event_name == 'push' || !inputs.dry_run
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
