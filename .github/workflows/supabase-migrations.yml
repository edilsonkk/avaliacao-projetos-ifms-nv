name: Migrações do Supabase (Produção)

# Valida e aplica supabase/migrations/ com `supabase db push`.
# - Pull request: só validação estática.
# - Chamado pelo release.yml quando uma versão é publicada: backup + db push.
# - Manual: dry run (padrão) ou aplicação.
# Guia: docs/banco-de-dados/migrations.md

on:
  # Em todo PR: os checks são obrigatórios na proteção da main. Sem mudança no
  # banco, o job de testes termina em segundos.
  pull_request:
    branches: [ "main" ]
  workflow_call:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: apenas mostrar o que seria aplicado'
        required: true
        default: true
        type: boolean
      emergencia:
        description: 'Ignorar o congelamento de deploy (somente correção crítica durante a feira)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Uma aplicação de cada vez, nunca cancelada no meio.
concurrency:
  group: supabase-migrations-producao
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.122.0

jobs:
  validate-migrations:
    name: Validação Estática das Migrações SQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validar nomes dos arquivos (AAAAMMDDHHMMSS_descricao.sql, versões únicas)
        run: |
          status=0
          for f in supabase/migrations/*.sql; do
            nome=$(basename "$f")
            if ! [[ "$nome" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "::error file=$f::Nome fora do padrão AAAAMMDDHHMMSS_descricao_em_snake_case.sql"
              status=1
            fi
          done
          duplicadas=$(ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$duplicadas" ]; then
            echo "::error::Versões de migration repetidas: $duplicadas"
            status=1
          fi
          exit $status

      - name: Bloquear DELETE sem WHERE, TRUNCATE e INDEX CONCURRENTLY
        run: |
          if grep -inE '^\s*DELETE\s+FROM\s+[a-zA-Z0-9_\.]+\s*;' supabase/migrations/*.sql; then
            echo "::error::DELETE sem cláusula WHERE em migration. Use 'WHERE <id> IS NOT NULL'."
            exit 1
          fi
          if grep -inE '^\s*TRUNCATE\s+(TABLE\s+)?[a-zA-Z0-9_\.]+' supabase/migrations/*.sql; then
            echo "::error::TRUNCATE em migration. Use DELETE com WHERE explícito."
            exit 1
          fi
          if grep -inE 'CREATE\s+(UNIQUE\s+)?INDEX\s+CONCURRENTLY' supabase/migrations/*.sql; then
            echo "::error::CREATE INDEX CONCURRENTLY não roda dentro da transação do supabase db push."
            exit 1
          fi
          echo "Validação estática concluída."

  testes-banco:
    name: Testes de Segurança do Banco (pgTAP)
    if: github.event_name == 'pull_request'
    needs: validate-migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Verificar se o PR altera o banco
        id: banco
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^supabase/(migrations|tests)/|^supabase/config\.toml$'; then
            echo "alterado=true" >> "$GITHUB_OUTPUT"
          else
            echo "alterado=false" >> "$GITHUB_OUTPUT"
            echo "PR sem mudanças no banco: testes pgTAP dispensados."
          fi

      - name: Configurar CLI do Supabase
        if: steps.banco.outputs.alterado == 'true'
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Subir Postgres local com todas as migrations
        if: steps.banco.outputs.alterado == 'true'
        run: |
          supabase db start
          supabase migration up --local

      - name: Rodar testes pgTAP (supabase/tests)
        if: steps.banco.outputs.alterado == 'true'
        run: supabase test db

  deploy-migrations:
    name: Backup e Aplicação (supabase db push)
    needs: validate-migrations
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_HOST: ${{ vars.SUPABASE_DB_HOST }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      # Em workflow_call não há inputs: aplica de fato.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - name: Respeitar congelamento de deploy
        if: vars.CONGELAMENTO_DEPLOY == 'true' && !inputs.emergencia && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          echo "::error::Deploy congelado (variável CONGELAMENTO_DEPLOY = true). Para correção crítica, rode manualmente com 'emergencia'."
          exit 1

      - name: Checkout do Repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar CLI do Supabase
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Conferir secrets obrigatórios
        run: |
          for v in SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF SUPABASE_DB_HOST BACKUP_PASSPHRASE; do
            if [ -z "${!v}" ]; then echo "::error::$v não configurado (secret do ambiente production ou variável do repositório)."; exit 1; fi
          done

      - name: Montar conexão com o banco (pooler IPv4, sem token de conta)
        run: |
          SENHA=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
          URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${SENHA}@${SUPABASE_DB_HOST}:5432/postgres"
          echo "::add-mask::$SENHA"
          echo "::add-mask::$URL"
          echo "DB_URL=$URL" >> "$GITHUB_ENV"

      - name: Histórico antes (local x remoto)
        run: supabase migration list --db-url "$DB_URL"

      - name: Dry run
        if: env.DRY_RUN == 'true'
        run: supabase db push --dry-run --db-url "$DB_URL"

      - name: Backup do banco (estrutura + dados, criptografado)
        if: env.DRY_RUN != 'true'
        run: |
          mkdir -p backup
          supabase db dump --db-url "$DB_URL" -f backup/estrutura.sql
          supabase db dump --db-url "$DB_URL" --data-only --use-copy -f backup/dados.sql
          tar -czf backup.tar.gz backup
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "backup-${GITHUB_RUN_ID}.tar.gz.gpg" backup.tar.gz
          rm -rf backup backup.tar.gz

      - name: Guardar backup (30 dias)
        if: env.DRY_RUN != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backup-banco-${{ github.run_id }}
          path: backup-${{ github.run_id }}.tar.gz.gpg
          retention-days: 30
          if-no-files-found: error

      - name: Aplicar migrations pendentes
        if: env.DRY_RUN != 'true'
        run: supabase db push --db-url "$DB_URL"

      - name: Histórico depois (todas devem constar no remoto)
        if: env.DRY_RUN != 'true'
        run: supabase migration list --db-url "$DB_URL"
