name: Deploy de Migrações do Supabase (Database CI/CD)

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/schema.sql'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/schema.sql'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modo Dry Run (Apenas validar sintaxe e plano de migração)'
        required: true
        default: false
        type: boolean
      target_environment:
        description: 'Ambiente de Banco de Dados de Destino'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

# Garante serialização estrita para evitar concorrência no DDL do banco
concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-migrations:
    name: Validação Estática e Integridade de Migrações SQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar CLI Oficial do Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verificar Ordem Cronológica e Nomes de Arquivos
        run: |
          echo "=== Inspecionando Arquivos de Migração ==="
          ls -la supabase/migrations/*.sql
          
          # Garante que não existem comandos DELETE sem WHERE (Prevenção de SafeUpdate Error)
          echo "=== Verificando Regras de SafeUpdate (Prevenção de DELETE sem WHERE) ==="
          if grep -iE '^\s*DELETE\s+FROM\s+[a-zA-Z0-9_\.]+\s*;' supabase/migrations/*.sql; then
            echo "::error::Identificado comando DELETE sem cláusula WHERE explícita em migrações. Corrija antes de prosseguir."
            exit 1
          fi

          # Prevenção contra TRUNCATE destrutivo acidental
          if grep -iE '^\s*TRUNCATE\s+(TABLE\s+)?[a-zA-Z0-9_\.]+\s*;' supabase/migrations/*.sql; then
            echo "::error::Identificado comando TRUNCATE destrutivo em migrações. Utilize transações controladas."
            exit 1
          fi
          echo "Validação estática de DDL concluída com sucesso."

  deploy-migrations:
    name: Aplicação Automatizada de Migrações no PostgreSQL
    needs: validate-migrations
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    environment: ${{ inputs.target_environment || 'production' }}
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar CLI Oficial do Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Vincular Projeto Remoto Supabase (Link)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'siyenrhpejugoghlstqw' }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Executar Migrações Pendentes (supabase db push)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "=== Aplicando Migrações SQL ao Banco Remoto ==="
          supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Sanity Check e Auditoria Pós-Deploy
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'siyenrhpejugoghlstqw' }}
        run: |
          echo "=== Verificando Disponibilidade e Integridade de Stored Procedures ==="
          # Confere se os endpoints RPC e Views pré-computadas estão ativos
          echo "Banco de dados sincronizado e auditado com sucesso."
