name: Migrações do Supabase (Produção)

# Valida e aplica supabase/migrations/ com `supabase db push`.
# - Pull request: só validação estática.
# - Chamado pelo release.yml quando uma versão é publicada: backup + db push.
# - Manual: dry run (padrão) ou aplicação.
# Guia: docs/banco-de-dados/migrations.md

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
  workflow_call:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: apenas mostrar o que seria aplicado'
        required: true
        default: true
        type: boolean
      emergencia:
        description: 'Ignorar o congelamento de deploy (somente correção crítica durante a feira)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Uma aplicação de cada vez, nunca cancelada no meio.
concurrency:
  group: supabase-migrations-producao
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.122.0

jobs:
  validate-migrations:
    name: Validação Estática das Migrações SQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Validar nomes dos arquivos (AAAAMMDDHHMMSS_descricao.sql, versões únicas)
        run: |
          status=0
          for f in supabase/migrations/*.sql; do
            nome=$(basename "$f")
            if ! [[ "$nome" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "::error file=$f::Nome fora do padrão AAAAMMDDHHMMSS_descricao_em_snake_case.sql"
              status=1
            fi
          done
          duplicadas=$(ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$duplicadas" ]; then
            echo "::error::Versões de migration repetidas: $duplicadas"
            status=1
          fi
          exit $status

      - name: Bloquear DELETE sem WHERE, TRUNCATE e INDEX CONCURRENTLY
        run: |
          if grep -inE '^\s*DELETE\s+FROM\s+[a-zA-Z0-9_\.]+\s*;' supabase/migrations/*.sql; then
            echo "::error::DELETE sem cláusula WHERE em migration. Use 'WHERE <id> IS NOT NULL'."
            exit 1
          fi
          if grep -inE '^\s*TRUNCATE\s+(TABLE\s+)?[a-zA-Z0-9_\.]+' supabase/migrations/*.sql; then
            echo "::error::TRUNCATE em migration. Use DELETE com WHERE explícito."
            exit 1
          fi
          if grep -inE 'CREATE\s+(UNIQUE\s+)?INDEX\s+CONCURRENTLY' supabase/migrations/*.sql; then
            echo "::error::CREATE INDEX CONCURRENTLY não roda dentro da transação do supabase db push."
            exit 1
          fi
          echo "Validação estática concluída."

  deploy-migrations:
    name: Backup e Aplicação (supabase db push)
    needs: validate-migrations
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      # Em workflow_call não há inputs: aplica de fato.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - name: Respeitar congelamento de deploy
        if: vars.CONGELAMENTO_DEPLOY == 'true' && !inputs.emergencia && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          echo "::error::Deploy congelado (variável CONGELAMENTO_DEPLOY = true). Para correção crítica, rode manualmente com 'emergencia'."
          exit 1

      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar CLI do Supabase
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Conferir secrets obrigatórios
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF BACKUP_PASSPHRASE; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v não configurado no ambiente production."; exit 1; fi
          done

      - name: Vincular projeto remoto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Histórico antes (local x remoto)
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"

      - name: Dry run
        if: env.DRY_RUN == 'true'
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Backup do banco (estrutura + dados, criptografado)
        if: env.DRY_RUN != 'true'
        run: |
          mkdir -p backup
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" -f backup/estrutura.sql
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" --data-only --use-copy -f backup/dados.sql
          tar -czf backup.tar.gz backup
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "backup-${GITHUB_RUN_ID}.tar.gz.gpg" backup.tar.gz
          rm -rf backup backup.tar.gz

      - name: Guardar backup (30 dias)
        if: env.DRY_RUN != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backup-banco-${{ github.run_id }}
          path: backup-${{ github.run_id }}.tar.gz.gpg
          retention-days: 30
          if-no-files-found: error

      - name: Aplicar migrations pendentes
        if: env.DRY_RUN != 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Histórico depois (todas devem constar no remoto)
        if: env.DRY_RUN != 'true'
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
