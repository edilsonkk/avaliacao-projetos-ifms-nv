name: Pipeline de Segurança (SAST & SCA)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Executa toda segunda-feira às 06:00 UTC (02:00 BRT)
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

# CodeQL e Code scanning (SARIF) só são gratuitos em repositório público. Em repositório privado,
# o CodeQL é pulado e o Trivy mostra o resultado no log (continua bloqueando HIGH/CRITICAL).
jobs:
  sast-codeql:
    name: SAST - Análise Estática de Código (CodeQL)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Executar CodeQL Autobuild
        uses: github/codeql-action/autobuild@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1

      - name: Executar Análise SAST do CodeQL
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          category: "/language:javascript-typescript"

  sca-trivy:
    name: SCA - Auditoria de Vulnerabilidades & Dependências (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Executar Varredura SCA com Trivy (Bloqueante para CRITICAL e HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (fixado por hash)
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: ${{ github.event.repository.private && 'table' || 'sarif' }}
          output: ${{ !github.event.repository.private && 'trivy-results.sarif' || '' }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: false

      - name: Publicar Resultados SARIF no GitHub Security
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        if: ${{ always() && !github.event.repository.private }}
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-sca'

  dependency-audit:
    name: Auditoria de Pacotes NPM (Audit Gate Bloqueante)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Executar NPM Audit Estrito
        run: |
          npm audit --audit-level=high
