name: Pipeline de Segurança (SAST & SCA)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Executa toda segunda-feira às 06:00 UTC (02:00 BRT)
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

# CodeQL e Code scanning (SARIF) só são gratuitos em repositório público. Em repositório privado,
# o CodeQL é pulado e o SARIF do Trivy não é gerado; o portão (tabela no log) continua bloqueando
# HIGH/CRITICAL.
jobs:
  sast-codeql:
    name: SAST - Análise Estática de Código (CodeQL)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Executar CodeQL Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Executar Análise SAST do CodeQL
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:javascript-typescript"

  sca-trivy:
    name: SCA - Auditoria de Vulnerabilidades & Dependências (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Com format: sarif a action ignora `severity` (o SARIF sai com todas as severidades) e o
      # exit-code passa a valer para qualquer achado, inclusive MEDIUM. Por isso o relatório e o
      # portão são passos separados: relatório completo em Security → Code scanning, bloqueio só
      # em CRITICAL/HIGH, como diz o nome do job.
      - name: Varredura SCA com Trivy (relatório completo, não bloqueia)
        if: ${{ !github.event.repository.private }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (fixado por hash)
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          ignore-unfixed: false

      - name: Portão SCA do Trivy (bloqueia CRITICAL e HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (fixado por hash)
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: false

      - name: Publicar Resultados SARIF no GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ always() && !github.event.repository.private }}
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-sca'

  dependency-audit:
    name: Auditoria de Pacotes NPM (Audit Gate Bloqueante)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Executar NPM Audit Estrito
        run: |
          npm audit --audit-level=high
